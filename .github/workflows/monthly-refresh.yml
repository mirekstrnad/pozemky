name: Mesicni aktualizace dat

# Jednou měsíčně udělá prázdný commit do `main`. Cloudflare Pages na push
# reaguje novým buildem (scraper znovu stáhne data z ÚZSVM), takže není
# potřeba žádný secret ani deploy hook v GitHubu.
#
# Push pomocí GITHUB_TOKEN záměrně nespouští další GitHub Actions workflow
# (update.yml), jen Cloudflare.

on:
  schedule:
    - cron: '17 4 1 * *'   # 1. den v měsíci, 04:17 UTC (06:17 v létě / 05:17 v zimě)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  trigger-cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prázdný commit do main (spustí build na Cloudflare Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Měsíční aktualizace dat ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
